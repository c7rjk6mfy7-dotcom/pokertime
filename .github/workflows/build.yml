name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            automake

      - name: Install buildozer and cython
        run: |
          pip install "pip==23.3.2" setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Create pip constraints
        run: |
          echo "pip==23.3.2" > $HOME/pip-constraints.txt
          echo "PIP_CONSTRAINT=$HOME/pip-constraints.txt" >> $GITHUB_ENV

      - name: Verify environment
        run: |
          python --version
          pip --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v5-

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-v5-${{ github.sha }}
          restore-keys: |
            buildozer-project-v5-

      - name: Build with Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
